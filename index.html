<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    
    <title>SPOT CHECK - CONTROL PROFESIONAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; }
        #main-scroll { overflow: auto; position: relative; background-color: #e2e8f0; -webkit-overflow-scrolling: touch; }
        #map-container { height: 1200px; width: 2000px; position: relative; background-color: #ffffff; transform-origin: top left; transition: transform 0.3s ease; }
        .design-grid { background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 30px 30px; }
        .mesa { position: absolute; z-index: 10; display: flex; align-items: center; justify-content: center; font-weight: 800; border-radius: 12px; transition: all 0.2s; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .mesa-free { background-color: #ffffff; color: #64748b; border: 2px solid #e2e8f0; }
        .mesa-occupied { background-color: #000000 !important; color: #ffffff !important; border: 2px solid #000000 !important; }
        .screen-overlay { position: fixed; left: 0; right: 0; bottom: 0; top: 205px; background-color: #f8fafc; z-index: 30; overflow-y: auto; display: none; padding-bottom: 140px; }
        .screen-overlay.active { display: flex; }
        #toast { position: fixed; bottom: 140px; left: 50%; transform: translateX(-50%) translateY(100px); transition: transform 0.3s ease; z-index: 1000; }
        #toast.show { transform: translateX(-50%) translateY(0); }

        /* ESTILOS PARA IMPRESIÓN PDF */
        @media print {
            body * { visibility: hidden; }
            #print-section, #print-section * { visibility: visible; }
            #print-section { position: absolute; left: 0; top: 0; width: 100%; padding: 40px; color: black !important; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none text-slate-900">

    <header class="bg-slate-950 text-white p-5 pt-12 flex justify-between items-center shrink-0 z-[60] shadow-2xl no-print">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center shadow-lg transform -rotate-3">
                <i class="fa-solid fa-layer-group text-slate-950 text-xl"></i>
            </div>
            <div>
                <h1 class="font-black text-xl italic leading-none tracking-tighter">SPOT CHECK</h1>
                <p class="text-[8px] text-slate-400 font-black tracking-widest uppercase mt-1">Professional Control</p>
            </div>
        </div>
        <button onclick="toggleLock()" id="lock-btn" class="w-12 h-12 bg-slate-900 rounded-2xl flex items-center justify-center border border-slate-800">
            <i class="fa-solid fa-lock text-red-500" id="lock-icon"></i>
        </button>
    </header>

    <div class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center z-50 shadow-sm shrink-0 no-print">
        <div class="flex gap-6">
            <div class="flex flex-col">
                <span class="text-[8px] font-black text-slate-400 uppercase tracking-widest">Mesas Ocupadas</span>
                <span id="stat-occupied" class="text-xl font-black leading-none">0</span>
            </div>
            <div class="flex flex-col border-l pl-6">
                <span class="text-[8px] font-black text-slate-400 uppercase tracking-widest">Ocupación</span>
                <span id="stat-percent" class="text-xl font-black leading-none text-emerald-600">0%</span>
            </div>
        </div>
        <div class="text-right">
            <p id="current-time" class="text-[10px] font-black text-slate-950 uppercase tracking-tighter">00:00:00</p>
        </div>
    </div>

    <nav class="px-4 py-3 bg-slate-50 flex gap-2 border-b border-slate-200 shrink-0 no-print">
        <div class="flex w-full bg-slate-200/50 p-1 rounded-2xl">
            <button onclick="setMode('audit')" id="nav-audit" class="flex-1 py-3 rounded-xl font-black text-[10px] uppercase bg-white shadow-sm">Auditar</button>
            <button onclick="setMode('design')" id="nav-design" class="flex-1 py-3 rounded-xl font-black text-[10px] uppercase text-slate-400">Diseño</button>
            <button onclick="setMode('history')" id="nav-history" class="flex-1 py-3 rounded-xl font-black text-[10px] uppercase text-slate-400">Historial</button>
        </div>
    </nav>

    <main class="flex-1 overflow-hidden relative no-print" id="main-scroll">
        <div id="map-container">
            <div id="mesas-layer" class="w-full h-full relative"></div>
        </div>
    </main>

    <div id="history-screen" class="screen-overlay flex-col p-6 no-print">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-black italic tracking-tighter text-slate-950">REPORTES<span class="text-emerald-500 text-4xl">.</span></h2>
            <button onclick="clearHistory()" class="text-[10px] font-black text-red-500 uppercase tracking-widest">Limpiar Todo</button>
        </div>
        <div id="history-list" class="space-y-4"></div>
    </div>

    <footer class="fixed bottom-0 left-0 right-0 p-6 bg-white/80 backdrop-blur-xl border-t border-slate-100 flex gap-3 z-[100] no-print">
        <button onclick="clearCurrentAudit()" class="w-14 h-14 bg-slate-100 text-slate-400 rounded-2xl flex items-center justify-center">
            <i class="fa-solid fa-rotate-left"></i>
        </button>
        <input type="file" id="ocr-camera-input" accept="image/*" capture="environment" class="hidden" onchange="processImageOCR(event)">
        <button onclick="document.getElementById('ocr-camera-input').click()" class="flex-1 bg-slate-950 text-emerald-400 h-14 rounded-3xl font-black uppercase flex items-center justify-center gap-2 shadow-2xl">
            <i id="ocr-icon" class="fa-solid fa-camera text-xs"></i> <span id="ocr-text">SCAN</span>
        </button>
        <button onclick="saveAudit()" class="flex-1 bg-emerald-500 text-slate-950 h-14 rounded-3xl font-black uppercase shadow-xl">Guardar</button>
    </footer>

    <div id="print-section" class="hidden font-mono text-sm leading-loose"></div>

    <div id="toast" class="bg-slate-950 text-white px-8 py-4 rounded-3xl font-bold text-xs shadow-2xl flex items-center gap-3 border border-slate-800 no-print">
        <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
        <span id="toast-msg">Mensaje</span>
    </div>

    <script>
        const DB_PREFIX = 'spotcheck_v3';
        let tables = JSON.parse(localStorage.getItem(`${DB_PREFIX}_tables`)) || [];
        let audits = JSON.parse(localStorage.getItem(`${DB_PREFIX}_audits`)) || [];
        let isLocked = true;
        let currentMode = 'audit';

        function init() {
            render();
            updateTime();
            setInterval(updateTime, 1000);
            document.getElementById('main-scroll').scrollLeft = 800;
            document.getElementById('main-scroll').scrollTop = 300;
        }

        function updateTime() {
            document.getElementById('current-time').innerText = new Date().toTimeString().split(' ')[0];
        }

        function render() {
            const layer = document.getElementById('mesas-layer');
            layer.innerHTML = '';
            let count = 0;
            tables.forEach(t => {
                if(t.status === 'occupied') count++;
                const div = document.createElement('div');
                div.className = `mesa ${t.status === 'occupied' ? 'mesa-occupied' : 'mesa-free'}`;
                div.style.left = t.x + 'px'; div.style.top = t.y + 'px';
                div.style.width = t.w + 'px'; div.style.height = t.h + 'px';
                div.innerText = t.label;
                div.onclick = () => { if(currentMode === 'audit') { t.status = t.status === 'free' ? 'occupied' : 'free'; render(); saveData(); } };
                layer.appendChild(div);
            });
            document.getElementById('stat-occupied').innerText = count;
            document.getElementById('stat-percent').innerText = tables.length > 0 ? Math.round((count / tables.length) * 100) + '%' : '0%';
        }

        async function processImageOCR(event) {
            const file = event.target.files[0];
            if (!file) return;
            const icon = document.getElementById('ocr-icon');
            const textSpan = document.getElementById('ocr-text');
            icon.className = "fa-solid fa-spinner animate-spin text-emerald-400";
            textSpan.innerText = "LEYENDO...";
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    Tesseract.recognize(img, 'eng').then(({ data: { text } }) => {
                        tables.forEach(t => t.status = 'free');
                        const matches = text.match(/(\d+)\s*\/\s*1/g) || [];
                        let detectedNumbers = matches.map(m => m.split('/')[0].trim());
                        let foundCount = 0;
                        tables.forEach(t => { if (detectedNumbers.includes(t.label)) { t.status = 'occupied'; foundCount++; } });
                        showToast(foundCount > 0 ? `Sincronizadas ${foundCount} mesas` : "No se detectaron mesas (/1)");
                        render(); saveData();
                    }).finally(() => {
                        icon.className = "fa-solid fa-camera text-xs";
                        textSpan.innerText = "SCAN";
                        document.getElementById('ocr-camera-input').value = "";
                    });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function saveAudit() {
            const occupied = tables.filter(t => t.status === 'occupied').map(t => t.label);
            if(occupied.length === 0) { showToast("No hay mesas seleccionadas"); return; }
            const now = new Date();
            const auditData = {
                id: Date.now(),
                fullDate: now.toLocaleString(),
                date: now.toLocaleDateString(),
                time: now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                count: occupied.length,
                details: occupied.join(', ')
            };
            audits.unshift(auditData);
            saveData();
            showToast("Reporte guardado");
            tables.forEach(t => t.status = 'free');
            render();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = audits.map(a => `
                <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
                    <div class="flex justify-between items-start mb-4">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${a.fullDate}</p>
                        <div class="flex gap-4">
                            <button onclick="exportToTXT(${a.id})" class="text-slate-400 hover:text-slate-900 transition-colors"><i class="fa-solid fa-file-lines text-xl"></i></button>
                            <button onclick="exportToPDF(${a.id})" class="text-emerald-600 hover:text-emerald-700 transition-colors"><i class="fa-solid fa-file-pdf text-xl"></i></button>
                        </div>
                    </div>
                    <div class="text-[11px] font-mono text-slate-600 leading-relaxed uppercase">
                        IMPRESION DE REPORTE (Open Checks): ${a.date} ${a.time}<br>
                        MESAS ABIERTAS REGISTRADAS: ${a.count}<br>
                        IN SITU SE OBSERVAN: (______) ${a.count} mesas ocupadas<br>
                        MESAS ABIERTAS EN MICROS (Captura): ${a.details}<br>
                        HORA DEL CONTROL: ${a.time}
                    </div>
                </div>
            `).join('') || '<p class="text-center text-slate-400 py-10 font-bold uppercase">Sin historial</p>';
        }

        function getReportContent(a) {
            return `IMPRESION DE REPORTE (Open Checks): ${a.date} ${a.time}\n\n` +
                   `MESAS ABIERTAS REGISTRADAS: ${a.count}\n` +
                   `IN SITU SE OBSERVAN: (Lugar          ) ${a.count} mesas ocupadas\n` +
                   `MESAS ABIERTAS EN MICROS (Captura): ${a.details}\n` +
                   `HORA DEL CONTROL: ${a.time}\n\n` +
                   `Observaciones: ___________________________\n\n` +
                   `Firma: ___________________________________`;
        }

        function exportToTXT(id) {
            const a = audits.find(x => x.id === id);
            const blob = new Blob([getReportContent(a)], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `Audit_${a.id}.txt`;
            link.click();
            URL.revokeObjectURL(url);
            showToast("TXT Descargado");
        }

        function exportToPDF(id) {
            const a = audits.find(x => x.id === id);
            const printArea = document.getElementById('print-section');
            printArea.innerHTML = getReportContent(a).replace(/\n/g, '<br>');
            printArea.classList.remove('hidden');
            window.print();
            printArea.classList.add('hidden');
        }

        function setMode(m) {
            currentMode = m;
            document.getElementById('nav-audit').className = m === 'audit' ? "flex-1 py-3 rounded-xl font-black text-[10px] uppercase bg-white shadow-sm" : "flex-1 py-3 rounded-xl font-black text-[10px] uppercase text-slate-400";
            document.getElementById('nav-design').className = m === 'design' ? "flex-1 py-3 rounded-xl font-black text-[10px] uppercase bg-white shadow-sm" : "flex-1 py-3 rounded-xl font-black text-[10px] uppercase text-slate-400";
            document.getElementById('nav-history').className = m === 'history' ? "flex-1 py-3 rounded-xl font-black text-[10px] uppercase bg-white shadow-sm" : "flex-1 py-3 rounded-xl font-black text-[10px] uppercase text-slate-400";
            document.getElementById('map-container').className = m === 'design' ? "design-grid" : "";
            document.getElementById('history-screen').classList.toggle('active', m === 'history');
            if(m === 'history') renderHistory();
            render();
        }

        function toggleLock() {
            isLocked = !isLocked;
            document.getElementById('lock-icon').className = isLocked ? "fa-solid fa-lock text-red-500" : "fa-solid fa-lock-open text-emerald-500";
            showToast(isLocked ? "Mapa Bloqueado" : "Edición Activa");
        }

        function clearCurrentAudit() { if(confirm("¿Reiniciar selección actual?")) { tables.forEach(t => t.status = 'free'); render(); saveData(); } }
        function clearHistory() { if(confirm("¿Borrar todo el historial?")) { audits = []; saveData(); renderHistory(); } }
        function saveData() {
            localStorage.setItem(`${DB_PREFIX}_tables`, JSON.stringify(tables));
            localStorage.setItem(`${DB_PREFIX}_audits`, JSON.stringify(audits));
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        init();
    </script>
</body>
</html>
