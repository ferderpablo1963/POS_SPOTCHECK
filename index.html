<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    
    <title>SPOT CHECK - CONTROL PROFESIONAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        body { font-family: system-ui, sans-serif; overscroll-behavior: none; background-color: #f8fafc; }
        input, textarea { user-select: text !important; -webkit-user-select: text !important; }
        #main-scroll { overflow: auto; position: relative; background-color: #e2e8f0; }
        #map-container { height: 1200px; width: 2000px; position: relative; background-color: #ffffff; transition: transform 0.3s ease; transform-origin: top left; }
        .design-grid { background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 30px 30px; }
        .mesa { position: absolute; transform-origin: center; transition: all 0.2s; z-index: 10; cursor: pointer; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; border: 2px solid #e2e8f0; background: white; color: #64748b; }
        .mesa-occupied { background-color: #000000 !important; color: #ffffff !important; border-color: #000000 !important; }
        .mesa-indet { background-color: #ef4444 !important; color: #ffffff !important; border-color: #ef4444 !important; }
        .handle { position: absolute; width: 30px; height: 30px; border-radius: 50%; display: none; z-index: 20; }
        .selected-design .handle { display: flex; }
        .resizer-handle { right: -15px; bottom: -15px; background: #f59e0b; }
        .rotator-handle { right: -15px; top: -15px; background: #3b82f6; }
        #toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(100px); transition: 0.3s; z-index: 1000; }
        #toast.show { transform: translateX(-50%) translateY(0); }
        .screen-overlay { position: fixed; inset: 205px 0 0 0; background: #f8fafc; z-index: 60; display: none; overflow-y: auto; }
        .screen-overlay.active { display: flex; }
        @media print { .no-print { display: none !important; } .print-only { display: block !important; } }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

    <header class="bg-slate-950 text-white p-5 pt-12 flex justify-between items-center z-[70] shadow-xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center transform -rotate-3">
                <i class="fa-solid fa-layer-group text-slate-950 text-xl"></i>
            </div>
            <div>
                <h1 class="font-black text-xl italic leading-none">SPOT CHECK</h1>
                <p class="text-[8px] text-slate-400 font-black tracking-widest uppercase">SISTEMA AUDITOR</p>
            </div>
        </div>
        <div class="flex gap-2">
            <label class="bg-emerald-500 px-4 py-2 rounded-xl flex items-center gap-2 cursor-pointer active:scale-95 transition-all">
                <i class="fa-solid fa-camera text-slate-950 text-xs"></i>
                <span class="text-[9px] font-black text-slate-950 uppercase">ESCANEAR POS</span>
                <input type="file" accept="image/*" capture="environment" class="hidden" onchange="processPOSImage(event)">
            </label>
            <button onclick="toggleLock()" id="lock-btn" class="px-4 py-2 bg-slate-900 rounded-xl border border-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-lock text-red-500" id="lock-icon"></i>
            </button>
        </div>
    </header>

    <nav class="px-4 py-3 bg-slate-50 flex gap-2 border-b border-slate-200 z-50">
        <div class="flex w-full bg-slate-200/50 p-1 rounded-2xl">
            <button onclick="setMode('audit')" id="nav-audit" class="flex-1 py-3 rounded-xl font-black text-[10px] uppercase transition-all bg-white shadow text-slate-950 border-b-2 border-emerald-500">Auditar</button>
            <button onclick="setMode('design')" id="nav-design" class="flex-1 py-3 rounded-xl font-black text-[10px] uppercase text-slate-400">Diseño</button>
            <button onclick="setMode('notes')" id="nav-notes" class="flex-1 py-3 rounded-xl font-black text-[10px] uppercase text-slate-400">Reporte</button>
            <button onclick="setMode('history')" id="nav-history" class="flex-1 py-3 rounded-xl font-black text-[10px] uppercase text-slate-400">Historial</button>
        </div>
    </nav>

    <main class="flex-1 overflow-hidden relative" id="main-scroll">
        <div id="map-container" onclick="deselectTable()">
            <div id="mesas-layer" class="w-full h-full relative"></div>
        </div>
    </main>

    <div id="notes-screen" class="screen-overlay flex-col p-4 pb-32">
        <div id="report-content" class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200 max-w-lg mx-auto w-full space-y-6">
            <div class="text-center border-b pb-4">
                <h2 class="font-black text-sm uppercase italic">FORMATO IMPRESION DE REPORTE (Open Checks)</h2>
                <p id="report-date-header" class="text-[10px] font-bold text-slate-500 mt-1"></p>
            </div>
            
            <div class="space-y-4 text-slate-800">
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl">
                    <span class="text-[10px] font-black uppercase">Mesas Abiertas Registradas:</span>
                    <span id="report-total-active" class="font-black text-emerald-600">0</span>
                </div>

                <div class="space-y-2">
                    <label class="text-[9px] font-black uppercase text-slate-400 italic">In Situ se observan:</label>
                    <div class="flex gap-2">
                        <input id="note-lugar" type="text" placeholder="Lugar (Ej: Lobby)" class="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold outline-none">
                        <input id="note-insitu" type="number" readonly class="w-20 p-3 bg-slate-100 border border-slate-200 rounded-xl text-center font-black">
                    </div>
                </div>

                <div>
                    <label class="text-[9px] font-black uppercase text-slate-400 italic">Mesas Abiertas en Micros (Captura):</label>
                    <input id="note-micros" type="number" oninput="calculateDiscrepancy()" placeholder="Cantidad en Sistema" class="w-full p-3 bg-emerald-50 border-2 border-emerald-500 rounded-xl font-black text-center text-emerald-700">
                </div>

                <div>
                    <label class="text-[9px] font-black uppercase text-slate-400 italic">Hora del Control:</label>
                    <input id="note-hora" type="text" readonly class="w-full p-3 bg-slate-100 border border-slate-200 rounded-xl text-center font-black">
                </div>

                <div>
                    <label class="text-[9px] font-black uppercase text-slate-400 italic">Observaciones:</label>
                    <textarea id="note-observaciones" rows="3" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium outline-none"></textarea>
                </div>

                <div>
                    <label class="text-[9px] font-black uppercase text-slate-400 italic">Firma:</label>
                    <input id="note-firma" type="text" placeholder="Nombre Auditor" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-black uppercase text-center outline-none">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-4 no-print">
                <button onclick="exportTxt()" class="bg-slate-800 text-white py-3 rounded-xl font-black text-[10px] uppercase flex items-center justify-center gap-2">
                    <i class="fa-solid fa-file-lines"></i> Exportar TXT
                </button>
                <button onclick="saveAudit()" class="bg-emerald-500 text-slate-950 py-3 rounded-xl font-black text-[10px] uppercase flex items-center justify-center gap-2 shadow-lg">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar Final
                </button>
            </div>
        </div>
    </div>

    <div id="history-screen" class="screen-overlay flex-col p-6">
        <h2 class="text-2xl font-black italic mb-6">HISTORIAL</h2>
        <div id="history-list" class="space-y-4 pb-24"></div>
    </div>

    <footer id="main-footer" class="p-6 bg-white border-t border-slate-200 shrink-0 z-50">
        <div id="audit-controls" class="flex gap-3">
            <button onclick="setMode('notes')" class="flex-[4] bg-slate-950 text-white py-5 rounded-2xl font-black text-xs uppercase shadow-xl flex items-center justify-center gap-3 active:scale-95 transition-all">
                <i class="fa-solid fa-file-export"></i> Generar Reporte Final
            </button>
            <button onclick="clearCurrentAudit()" class="flex-1 bg-slate-100 text-slate-400 py-5 rounded-2xl flex items-center justify-center active:bg-red-50">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
        </div>
        <div id="design-controls" class="hidden flex flex-col gap-3">
            <div id="table-edit-zone" class="hidden flex gap-2">
                <input id="label-input" type="text" class="flex-1 bg-slate-100 p-4 rounded-xl font-black outline-none" placeholder="Mesa ID">
                <button onclick="deleteSelected()" class="bg-red-100 text-red-500 w-14 rounded-xl"><i class="fa-solid fa-trash"></i></button>
                <button onclick="deselectTable()" class="bg-slate-900 text-white w-14 rounded-xl"><i class="fa-solid fa-check"></i></button>
            </div>
            <div class="flex gap-2">
                <button onclick="addTable('simple')" class="flex-1 bg-slate-800 text-white py-4 rounded-xl font-black text-[10px] uppercase">Añadir Mesa</button>
                <button onclick="addTable('vip')" class="flex-1 bg-amber-500 text-slate-950 py-4 rounded-xl font-black text-[10px] uppercase">Añadir VIP</button>
            </div>
        </div>
    </footer>

    <div id="toast" class="bg-slate-900 text-white px-6 py-3 rounded-full font-bold text-xs uppercase flex items-center gap-3">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-msg">Mensaje</span>
    </div>

    <script>
        const DB_PREFIX = 'spotcheck_v_final';
        let tables = JSON.parse(localStorage.getItem(`${DB_PREFIX}_tables`)) || [];
        let audits = JSON.parse(localStorage.getItem(`${DB_PREFIX}_audits`)) || [];
        let isLocked = true;
        let currentMode = 'audit';
        let selectedId = null;

        // --- ALGORITMO OCR MEJORADO ---
        async function processPOSImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            showToast("Buscando patrones Tbl #/ ...");
            try {
                // LIMPIEZA PREVIA (Todo a blanco)
                tables.forEach(t => t.status = 'free');
                
                const { data: { text } } = await Tesseract.recognize(file, 'eng');
                const tableRegex = /Tbl\s+(\d+)\//gi;
                let match;
                let foundCount = 0;

                while ((match = tableRegex.exec(text)) !== null) {
                    const mesa = tables.find(t => t.label === match[1]);
                    if (mesa) {
                        mesa.status = 'occupied';
                        foundCount++;
                    }
                }
                saveData(); render();
                showToast(foundCount > 0 ? `Se pintaron ${foundCount} mesas de negro` : "No se encontró el formato Tbl #/");
            } catch (e) { showToast("Error al procesar imagen"); }
            event.target.value = '';
        }

        function init() {
            if (tables.length === 0) {
                tables = [
                    { id: 1, label: "1", x: 200, y: 200, w: 70, h: 70, status: 'free', rotation: 0 },
                    { id: 2, label: "2", x: 300, y: 200, w: 70, h: 70, status: 'free', rotation: 0 }
                ];
            }
            render();
            setInterval(() => {
                const now = new Date();
                const h = now.getHours().toString().padStart(2, '0');
                const m = now.getMinutes().toString().padStart(2, '0');
                document.getElementById('note-hora').value = `${h}:${m}`;
                document.getElementById('report-date-header').innerText = now.toLocaleDateString() + ' ' + h + ':' + m;
            }, 1000);
        }

        function render() {
            const layer = document.getElementById('mesas-layer');
            layer.innerHTML = '';
            let activeCount = 0;
            tables.forEach(t => {
                if (t.status !== 'free') activeCount++;
                const div = document.createElement('div');
                div.className = `mesa mesa-${t.status} ${selectedId === t.id && currentMode === 'design' ? 'selected-design' : ''}`;
                div.style.cssText = `left:${t.x}px; top:${t.y}px; width:${t.w}px; height:${t.h}px; transform:translate(-50%,-50%) rotate(${t.rotation}deg)`;
                div.innerHTML = `<span>${t.label}</span>`;
                
                if (currentMode === 'design' && !isLocked) {
                    const r = document.createElement('div'); r.className = 'handle resizer-handle';
                    const o = document.createElement('div'); o.className = 'handle rotator-handle';
                    div.append(r, o);
                }

                div.onclick = (e) => {
                    e.stopPropagation();
                    if (currentMode === 'audit') {
                        t.status = t.status === 'free' ? 'occupied' : (t.status === 'occupied' ? 'indet' : 'free');
                        saveData(); render();
                    } else if (currentMode === 'design' && !isLocked) {
                        selectedId = t.id;
                        document.getElementById('table-edit-zone').classList.remove('hidden');
                        document.getElementById('label-input').value = t.label;
                        render();
                    }
                };
                layer.appendChild(div);
            });
            document.getElementById('note-insitu').value = activeCount;
            document.getElementById('report-total-active').innerText = activeCount;
        }

        function exportTxt() {
            const a = {
                fecha: new Date().toLocaleDateString(),
                hora: document.getElementById('note-hora').value,
                lugar: document.getElementById('note-lugar').value,
                insitu: document.getElementById('note-insitu').value,
                micros: document.getElementById('note-micros').value,
                obs: document.getElementById('note-observaciones').value,
                firma: document.getElementById('note-firma').value
            };
            const content = `FORMATO IMPRESION DE REPORTE (Open Checks)\nFecha y hora: ${a.fecha} ${a.hora}\n\nMESAS ABIERTAS REGISTRADAS: ${a.insitu}\nIN SITU SE OBSERVAN: (${a.lugar}) ${a.insitu} mesas ocupadas\nMESAS ABIERTAS EN MICROS: ${a.micros}\nHORA DEL CONTROL: ${a.hora}\n\nObservaciones: ${a.obs}\n\nFirma: ${a.firma}`;
            const blob = new Blob([content], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Reporte_${a.fecha.replace(/\//g, '-')}.txt`;
            link.click();
        }

        function saveAudit() {
            audits.unshift({ id: Date.now(), fecha: new Date().toLocaleDateString(), lugar: document.getElementById('note-lugar').value, insitu: document.getElementById('note-insitu').value });
            saveData();
            showToast("Reporte guardado en Historial");
            setMode('history');
        }

        function renderHistory() {
            document.getElementById('history-list').innerHTML = audits.map(a => `
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex justify-between font-black text-[10px] uppercase">
                        <span>${a.fecha} - ${a.lugar}</span>
                        <span class="text-emerald-500">${a.insitu} Mesas</span>
                    </div>
                </div>
            `).join('');
        }

        function setMode(m) {
            currentMode = m;
            document.querySelectorAll('nav button').forEach(b => b.className = 'flex-1 py-3 rounded-xl font-black text-[10px] uppercase text-slate-400');
            document.getElementById(`nav-${m}`).className = 'flex-1 py-3 rounded-xl font-black text-[10px] uppercase bg-white shadow text-slate-950 border-b-2 border-emerald-500';
            document.getElementById('notes-screen').classList.toggle('active', m === 'notes');
            document.getElementById('history-screen').classList.toggle('active', m === 'history');
            document.getElementById('audit-controls').classList.toggle('hidden', m !== 'audit');
            document.getElementById('design-controls').classList.toggle('hidden', m !== 'design');
            if(m === 'history') renderHistory();
            render();
        }

        function toggleLock() { isLocked = !isLocked; document.getElementById('lock-icon').className = isLocked ? 'fa-solid fa-lock text-red-500' : 'fa-solid fa-unlock text-emerald-400'; render(); }
        function showToast(m) { document.getElementById('toast-msg').innerText = m; document.getElementById('toast').classList.add('show'); setTimeout(() => document.getElementById('toast').classList.remove('show'), 2500); }
        function clearCurrentAudit() { if(confirm("¿Limpiar auditoría actual?")) { tables.forEach(t => t.status = 'free'); saveData(); render(); } }
        function addTable(type) { tables.push({ id: Date.now(), label: (tables.length + 1).toString(), x: 200, y: 200, w: type === 'vip' ? 120 : 70, h: 70, status: 'free', rotation: 0 }); render(); }
        function deleteSelected() { tables = tables.filter(t => t.id !== selectedId); selectedId = null; render(); }
        function deselectTable() { selectedId = null; document.getElementById('table-edit-zone').classList.add('hidden'); render(); }
        function saveData() { localStorage.setItem(`${DB_PREFIX}_tables`, JSON.stringify(tables)); localStorage.setItem(`${DB_PREFIX}_audits`, JSON.stringify(audits)); }

        window.onload = init;
    </script>
</body>
</html>
