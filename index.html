<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    
    <title>SPOT CHECK - CONTROL PROFESIONAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            overscroll-behavior: none; 
            background-color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Contenedor principal de scroll para el mapa */
        #main-scroll {
            flex: 1;
            overflow: auto;
            position: relative;
            background-color: #e2e8f0;
            z-index: 10;
        }

        #map-container { 
            height: 1200px; 
            width: 2000px;
            position: relative;
            background-color: #ffffff;
        }

        .mesa {
            position: absolute;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            border-radius: 12px;
            transition: all 0.2s;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .mesa-free { background-color: #ffffff; color: #64748b; border: 2px solid #e2e8f0; }
        .mesa-occupied { background-color: #000000 !important; color: #ffffff !important; border: 2px solid #000000 !important; }

        /* Pantallas de Historial/Diseño por encima del mapa pero debajo del footer */
        .screen-overlay {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 80px; /* Espacio para el footer */
            top: 190px;   /* Debajo del Nav */
            background-color: #f8fafc;
            z-index: 40;
            overflow-y: auto;
            display: none;
            padding: 20px;
        }
        .screen-overlay.active { display: block; }

        /* Toast de mensajes */
        #toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            transition: transform 0.3s ease;
            z-index: 2000;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body class="overflow-hidden select-none">

    <header class="bg-slate-950 text-white p-4 pt-10 flex justify-between items-center shrink-0 z-[100]">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center">
                <i class="fa-solid fa-layer-group text-slate-950"></i>
            </div>
            <div>
                <h1 class="font-black text-lg italic leading-none">SPOT CHECK</h1>
                <p class="text-[8px] text-slate-400 uppercase tracking-widest">Control Profesional</p>
            </div>
        </div>
        <button onclick="toggleLock()" class="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center border border-slate-800">
            <i class="fa-solid fa-lock text-red-500" id="lock-icon"></i>
        </button>
    </header>

    <div class="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center z-[90]">
        <div class="flex gap-4">
            <div class="text-center">
                <p class="text-[8px] font-bold text-slate-400 uppercase">Mesas</p>
                <p id="stat-occupied" class="text-lg font-black leading-none">0</p>
            </div>
            <div class="text-center border-l pl-4">
                <p class="text-[8px] font-bold text-slate-400 uppercase">Ratio</p>
                <p id="stat-percent" class="text-lg font-black text-emerald-600 leading-none">0%</p>
            </div>
        </div>
        <p id="current-time" class="text-[10px] font-mono font-bold">00:00:00</p>
    </div>

    <nav class="px-4 py-2 bg-slate-50 border-b border-slate-200 z-[90]">
        <div class="flex bg-slate-200/50 p-1 rounded-xl">
            <button onclick="setMode('audit')" id="nav-audit" class="flex-1 py-2 rounded-lg font-black text-[10px] uppercase bg-white shadow-sm">Auditar</button>
            <button onclick="setMode('design')" id="nav-design" class="flex-1 py-2 rounded-lg font-black text-[10px] uppercase text-slate-400">Diseño</button>
            <button onclick="setMode('history')" id="nav-history" class="flex-1 py-2 rounded-lg font-black text-[10px] uppercase text-slate-400">Reportes</button>
        </div>
    </nav>

    <main id="main-scroll">
        <div id="map-container">
            <div id="mesas-layer" class="w-full h-full relative"></div>
        </div>
    </main>

    <div id="history-screen" class="screen-overlay">
        <h2 class="text-xl font-black mb-4 uppercase italic">Historial de Auditorías</h2>
        <div id="history-list" class="space-y-3 font-mono text-[11px]"></div>
    </div>

    <footer class="bg-white border-t border-slate-200 p-4 flex gap-3 z-[100] shrink-0">
        <button onclick="clearCurrentAudit()" class="w-12 h-12 bg-slate-100 text-slate-400 rounded-xl flex items-center justify-center">
            <i class="fa-solid fa-rotate-left"></i>
        </button>
        
        <input type="file" id="ocr-camera-input" accept="image/*" capture="environment" class="hidden" onchange="processImageOCR(event)">
        
        <button onclick="document.getElementById('ocr-camera-input').click()" class="flex-1 bg-slate-950 text-emerald-400 h-12 rounded-2xl font-black uppercase flex items-center justify-center gap-2 shadow-lg">
            <i id="ocr-icon" class="fa-solid fa-camera"></i> <span id="ocr-text">SCAN POS</span>
        </button>
        
        <button onclick="saveAudit()" class="flex-1 bg-emerald-500 text-slate-950 h-12 rounded-2xl font-black uppercase shadow-lg">
            Guardar
        </button>
    </footer>

    <div id="toast" class="bg-slate-900 text-white px-6 py-3 rounded-2xl font-bold text-[10px] shadow-2xl flex items-center gap-3">
        <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
        <span id="toast-msg">Mensaje</span>
    </div>

    <script>
        const DB_PREFIX = 'spotcheck_final';
        let tables = JSON.parse(localStorage.getItem(`${DB_PREFIX}_tables`)) || [];
        let audits = JSON.parse(localStorage.getItem(`${DB_PREFIX}_audits`)) || [];
        let isLocked = true;
        let currentMode = 'audit';

        function init() {
            render();
            updateTime();
            setInterval(updateTime, 1000);
            const scroll = document.getElementById('main-scroll');
            scroll.scrollLeft = 850; scroll.scrollTop = 400;
        }

        function updateTime() {
            document.getElementById('current-time').innerText = new Date().toLocaleTimeString();
        }

        function render() {
            const layer = document.getElementById('mesas-layer');
            layer.innerHTML = '';
            let count = 0;
            tables.forEach(t => {
                if(t.status === 'occupied') count++;
                const div = document.createElement('div');
                div.className = `mesa ${t.status === 'occupied' ? 'mesa-occupied' : 'mesa-free'}`;
                div.style.left = t.x + 'px'; div.style.top = t.y + 'px';
                div.style.width = t.w + 'px'; div.style.height = t.h + 'px';
                div.innerText = t.label;
                div.onclick = () => { if(currentMode === 'audit') { t.status = t.status === 'free' ? 'occupied' : 'free'; render(); saveData(); } };
                layer.appendChild(div);
            });
            document.getElementById('stat-occupied').innerText = count;
            document.getElementById('stat-percent').innerText = tables.length ? Math.round((count/tables.length)*100)+'%' : '0%';
        }

        async function processImageOCR(event) {
            const file = event.target.files[0];
            if (!file) return;

            const icon = document.getElementById('ocr-icon');
            const textSpan = document.getElementById('ocr-text');
            icon.className = "fa-solid fa-spinner animate-spin";
            textSpan.innerText = "LEYENDO...";

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    Tesseract.recognize(img, 'eng').then(({ data: { text } }) => {
                        // 1. Resetear mesas antes de pintar nuevas
                        tables.forEach(t => t.status = 'free');

                        // 2. Extraer números de formato "Mesa/1"
                        const matches = text.match(/(\d+)\s*\/\s*1/g) || [];
                        const detected = matches.map(m => m.split('/')[0].trim());

                        let matched = 0;
                        tables.forEach(t => {
                            if(detected.includes(t.label)) {
                                t.status = 'occupied';
                                matched++;
                            }
                        });

                        showToast(matched > 0 ? `Sincronizadas ${matched} mesas` : "No se detectaron mesas");
                        render(); saveData();
                    }).finally(() => {
                        icon.className = "fa-solid fa-camera";
                        textSpan.innerText = "SCAN POS";
                        document.getElementById('ocr-camera-input').value = "";
                    });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function saveAudit() {
            const occupied = tables.filter(t => t.status === 'occupied').map(t => t.label);
            if(!occupied.length) return showToast("Sin datos para guardar");
            
            const report = {
                id: Date.now(),
                date: new Date().toLocaleDateString(),
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                count: occupied.length,
                details: occupied.join(', ')
            };
            audits.unshift(report);
            saveData();
            showToast("Reporte Guardado");
            tables.forEach(t => t.status = 'free');
            render();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = audits.map(a => `
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm uppercase">
                    <p class="font-black text-slate-400 mb-2 border-b pb-1">${a.date} - ${a.time}</p>
                    REPORTE OPEN CHECKS: ${a.count} MESAS<br>
                    MESAS EN MICROS: ${a.details}<br><br>
                    FIRMA: ____________________
                </div>
            `).join('') || '<p class="text-center py-10 opacity-30">SIN HISTORIAL</p>';
        }

        function setMode(m) {
            currentMode = m;
            document.getElementById('nav-audit').className = m === 'audit' ? "flex-1 py-2 rounded-lg font-black text-[10px] uppercase bg-white shadow-sm" : "flex-1 py-2 rounded-lg font-black text-[10px] uppercase text-slate-400";
            document.getElementById('nav-design').className = m === 'design' ? "flex-1 py-2 rounded-lg font-black text-[10px] uppercase bg-white shadow-sm" : "flex-1 py-2 rounded-lg font-black text-[10px] uppercase text-slate-400";
            document.getElementById('nav-history').className = m === 'history' ? "flex-1 py-2 rounded-lg font-black text-[10px] uppercase bg-white shadow-sm" : "flex-1 py-2 rounded-lg font-black text-[10px] uppercase text-slate-400";
            
            document.getElementById('history-screen').classList.toggle('active', m === 'history');
            if(m === 'history') renderHistory();
            render();
        }

        function toggleLock() {
            isLocked = !isLocked;
            document.getElementById('lock-icon').className = isLocked ? "fa-solid fa-lock text-red-500" : "fa-solid fa-lock-open text-emerald-500";
            showToast(isLocked ? "Mapa Bloqueado" : "Edición Libre");
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function saveData() {
            localStorage.setItem(`${DB_PREFIX}_tables`, JSON.stringify(tables));
            localStorage.setItem(`${DB_PREFIX}_audits`, JSON.stringify(audits));
        }

        function clearCurrentAudit() { if(confirm("¿Limpiar mesas?")) { tables.forEach(t => t.status = 'free'); render(); saveData(); } }

        init();
    </script>
</body>
</html>
